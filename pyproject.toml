[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ternopil-events-bot"
version = "0.1.0"
description = "Telegram bot and event aggregator for Ternopil"
requires-python = ">=3.11"
dependencies = ["aiogram>=3.22,<4", "httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "lxml>=5,<7", "sqlalchemy>=2.0,<3", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.6,<3", "python-dateutil>=2.9,<3"]
[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.12,<1"]
[tool.setuptools]
packages = ["app", "app.bot", "app.collectors", "app.db", "app.services"]
[tool.ruff]
line-length = 100
target-version = "py311"
