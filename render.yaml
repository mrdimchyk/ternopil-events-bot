services:
  - type: web
    name: ternopil-events-bot
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    maxShutdownDelaySeconds: 30
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: CITY_NAME
        value: Ternopil
      - key: TIMEZONE
        value: Europe/Kyiv
