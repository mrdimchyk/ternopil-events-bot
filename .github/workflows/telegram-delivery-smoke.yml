name: Telegram delivery smoke test

on:
  workflow_dispatch:

jobs:
  delivery-smoke:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install package
        run: python -m pip install -e .

      - name: Send Telegram delivery smoke test
        run: |
          set -euo pipefail
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
          python - <<'PY'
          import os
          from app.services.telegram_delivery import TelegramDelivery

          chat_id = int(os.environ["TELEGRAM_CHAT_ID"])
          delivery = TelegramDelivery(os.environ["TELEGRAM_BOT_TOKEN"])
          try:
              delivery.send_message(
                  chat_id,
                  "🟢 KARABAS Telegram delivery smoke test\n\n"
                  "Telegram API → TelegramDelivery → this chat: OK",
              )
          finally:
              delivery.close()
          print("Telegram delivery smoke test: OK")
          PY
