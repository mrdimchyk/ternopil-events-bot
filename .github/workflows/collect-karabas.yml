name: Collect Ternopil events

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 6,10,14,18 * * *"

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e .
      - name: Validate collector registry
        run: python -c "from app.collectors.registry import validate_collectors; validate_collectors()"
      - name: Repair stored events missing dates
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/repair_event_dates.py
      - name: Capture KARABAS production responses
        continue-on-error: true
        run: python scripts/diagnose_karabas.py
      - name: Collect all sources
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PYTHONUNBUFFERED: "1"
        run: python scripts/collect_all.py
      - name: Publish source health summary
        if: always()
        run: |
          if [ -f quality-report.json ]; then
            echo "## Source health" >> "$GITHUB_STEP_SUMMARY"
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("quality-report.json").read_text(encoding="utf-8"))
          health = report.get("source_health", {})
          print(f"**Overall:** `{health.get('overall', 'unknown')}`")
          print("")
          print("| Source | Status | Latest | Median | Next 7d | Next event |")
          print("|---|---|---:|---:|---:|---|")
          for name, item in health.get("sources", {}).items():
              print(
                  f"| {name} | `{item.get('status')}` | {item.get('latest_collected')} "
                  f"| {item.get('median_collected')} | {item.get('events_next_7d')} "
                  f"| {item.get('next_event_at')} |"
              )
          PY
          else
            echo "## Source health" >> "$GITHUB_STEP_SUMMARY"
            echo "No quality-report.json was produced." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload production quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report-${{ github.run_id }}
          path: quality-report.json
          if-no-files-found: warn
      - name: Upload KARABAS production responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: karabas-production-responses-${{ github.run_id }}
          path: karabas-production-responses/
          if-no-files-found: warn
