name: Deliver due Telegram notifications

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  deliver:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e .
      - name: Deliver due notifications
        run: python scripts/deliver_notifications.py
