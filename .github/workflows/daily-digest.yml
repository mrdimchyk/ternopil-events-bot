name: Send daily Ternopil events digest

on:
  workflow_dispatch:
  schedule:
    # 21:00 Europe/Kyiv during summer time (UTC+3).
    - cron: "0 18 * * *"

jobs:
  digest:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.CHAT_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -e .
      - name: Validate required secrets
        run: |
          test -n "$DATABASE_URL"
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID"
      - name: Send tomorrow digest
        run: python scripts/send_daily_digest.py
